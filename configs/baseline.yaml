data_file_name: sequences_noface_128.npy
n_frames : 128

model: 'CNNTransformer' # match with the keys in MODELS in run_training.py (this goes for optimizer and criterion)
device: 'mps'
batch_size: 64
epochs: 50
seed: 42

optimizer:
  name: adam
  lr: 1.0e-4
  weight_decay: 0.0

criterion:
  name: cross_entropy
  label_smoothing: 0.0